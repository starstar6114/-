<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️我們要結婚了！❤️</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-layout">
        <!-- Left side: Countdown Calendar -->
        <div class="countdown-calendar">
            <div class="calendar-title">🥢2026.10.06🥜</div>
            <div class="calendar-subtitle">專案完工日期</div>
            <div class="countdown-display">
                <div class="countdown-item">
                    <div class="countdown-number" id="days">0</div>
                    <div class="countdown-label">天</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="hours">0</div>
                    <div class="countdown-label">小時</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="minutes">0</div>
                    <div class="countdown-label">分</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="seconds">0</div>
                    <div class="countdown-label">秒</div>
                </div>
            </div>
        </div>

        <!-- Center: Main Content -->
        <div class="container">
            <h1 class="title">❤️我們要結婚了！！❤️</h1>
            
            <div class="input-section">
                <div class="input-group">
                    <label for="new-todo">專案名稱</label>
                    <input type="text" id="new-todo" placeholder="專案名稱">
                </div>
                <div class="input-group">
                    <label for="description">承辦進度</label>
                    <textarea id="description" placeholder="承辦進度"></textarea>
                </div>
                <button id="add-btn" class="add-btn">上簽</button>
            </div>
            
            <div class="todo-list-container">
                <div id="todo-list" class="todo-list">
                    <!-- Todo items will be dynamically added here -->
                </div>
            </div>

            <!-- Bottom: Total Cost Display -->
            <div class="total-cost-footer">
                <div class="total-cost-label">目前總共花費</div>
                <div class="total-cost-amount" id="total-cost-display">0 元</div>
            </div>
        </div>

        <!-- Right side: Cost Input -->
        <div class="cost-section">
            <div class="cost-header">
                <label for="cost-input">專案經費成本</label>
                <input type="number" id="cost-input" placeholder="輸入金額" min="0" step="0.01">
                <button id="add-cost-btn" class="add-cost-btn">新增</button>
            </div>
            <div class="cost-summary">
                <div class="cost-total-display">
                    <span class="cost-icon" id="cost-icon">💰</span>
                    <span class="cost-total-text">累積總額：<span id="cost-total">0</span> 元</span>
                </div>
                <div id="cost-details" class="cost-details">
                    <!-- Cost details will be dynamically added here -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
